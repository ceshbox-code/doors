<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183b56">
  <meta name="description" content="Учёт выполненных работ, дверей и оплаты">
  <link rel="icon" type="image/png"
        href="/images/favico/favicon-96x96.png"
        sizes="96x96">
  <link rel="icon" type="image/svg+xml"
        href="/images/favico/favicon.svg">
  <link rel="shortcut icon"
        href="/images/favico/favicon.ico">
  <link rel="apple-touch-icon"
        sizes="180x180"
        href="/images/favico/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DOOR">
  <link rel="manifest"
        href="/images/favico/site.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <title>DOOR</title>
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot-screen"><span class="brand-mark">Д</span><p>Загрузка приложения…</p></div>
  </div>
  <noscript>Для работы приложения необходимо включить JavaScript.</noscript>
  <script>
window.__doorModuleStarted = false;
window.__doorBootStage = 'html-loaded';

setTimeout(function () {
  const app = document.getElementById('app');

  if (!app || !app.querySelector('.boot-screen')) return;

  const moduleStarted = window.__doorModuleStarted;
  const stage = window.__doorBootStage || 'unknown';

  app.innerHTML = '<div class="boot-screen"><p id="boot-diagnostic"></p></div>';

  const message = moduleStarted
    ? 'Приложение остановилось на этапе: ' + stage
    : 'JavaScript-модуль app.js не запустился. Проверьте загрузку оболочки и Service Worker.';

  document.getElementById('boot-diagnostic').textContent =
    'ДИАГНОСТИКА ЗАПУСКА: ' + message;
}, 12000);
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
